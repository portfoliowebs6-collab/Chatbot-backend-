<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kewa AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Background -->
        <div class="background"></div>

        <!-- Main Chat -->
        <main class="chat-container">

            <!-- Header -->
            <header class="chat-header">
                <div class="brand">
                    <div class="logo">K</div>

                    <div>
                        <h1>Kewa AI</h1>
                        <p>AI Assistant</p>
                    </div>
                </div>

                <div class="status">
                    <span></span>
                    Online
                </div>
            </header>


            <!-- Messages -->
            <section class="chat-box" id="chatBox">

                <!-- Welcome message -->
                <div class="message ai-message">
                    <div class="avatar">K</div>

                    <div class="bubble">
                        <p>
                            Hey! 👋 I'm Kewa AI.<br>
                            How can I help you today?
                        </p>
                    </div>
                </div>

            </section>


            <!-- Input -->
            <div class="input-area">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Message Kewa AI..."
                    autocomplete="off"
                >

                <button id="sendButton" type="button">
                    <span>➤</span>
                </button>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
