<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kewa Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font & FontAwesome/Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="bot-icon-small"><i class="fa-solid fa-robot"></i></div>
                <div class="logo-text">
                    <h2>AI Chatbot</h2>
                    <p>Your Smart Assistant</p>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active"><i class="fa-regular fa-comment"></i> Chat</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-compass"></i> Explore</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-clock"></i> History</a>
                <a href="#" class="nav-item"><i class="fa-gear fa-solid"></i> Settings</a>
            </nav>

            <div class="sidebar-card">
                <div class="sparkle"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <h4>Ask anything...</h4>
                <p>I'm here to help you with your questions, ideas and more.</p>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="header-user">
                    <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div>
                        <h3>Kewa AI Assistant</h3>
                        <span class="status-indicator"><span class="dot"></span> Online</span>
                    </div>
                </div>
                <div class="header-actions">
                    <i class="fa-regular fa-sun"></i>
                </div>
            </header>

            <!-- Chat Messages Box -->
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content">
                        <p>Hello! 👋<br>I'm your AI assistant. How can I help you today?</p>
                        <span class="timestamp">10:24 AM</span>
                    </div>
                </div>
            </div>

            <!-- Chat Input Area -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button class="attach-btn"><i class="fa-solid fa-paperclip"></i></button>
                    <input type="text" id="userInput" placeholder="Type your message...">
                    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
